[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "3d-genome-hub"
version = "3.0.0"
description = "Auto-updating, relevance-filtered literature tracker for 3D genome & deep learning research"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.3",
    "click>=8.1.0,<8.2",
    "rich>=13.7.1",
    "jinja2>=3.1.3",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
genome-literature = "genome_literature.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genome_literature = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
